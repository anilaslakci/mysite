media:
  - name: portfolio
    label: Portfolyo görselleri
    input: assets/portfolio
    output: /assets/portfolio
    rename: random
    extensions:
      - png
      - jpg
      - jpeg
content:
  - name: projects
    label: Portfolyo projeleri
    type: collection
    path: src/content/projects
    format: json
    subfolders: false
    filename:
      template: '{fields.id}.json'
      field: false
    operations:
      create: true
      rename: false
      delete: true
    view:
      primary: tr.title
      fields:
        - id
        - tr.title
        - en.title
        - category
        - order
        - archived
      sort:
        - order
        - id
        - tr.title
      search:
        - tr.title
        - en.title
      default:
        sort: order
        order: asc
    fields:
      - name: id
        label: Proje kimliği
        type: number
        required: true
        options:
          min: 1
        description: >-
          Kalıcı kimlik: mevcut kayıtta değiştirmeyin. Yeni kayıt için kullanılmayan pozitif tam sayı girin
          (ör. en büyük kimlik + 1). Sıralamadan bağımsızdır. Çakışma ve dosya adı uyuşmazlığı derlemede
          reddedilir; CMS otomatik artan kimlik garantisi vermez.
      - name: order
        label: Sıralama
        type: number
        options:
          min: 1
        description: >-
          Küçük sayılar önce görünür. Boş bırakılanlar listenin sonuna gelir. Eşit sıralarda küçük proje
          kimliği önce gelir. Koleksiyon sıralaması sayı ile yapılır; sürükle-bırak değildir.
      - name: archived
        label: Arşivle (sitede gizle)
        type: boolean
        default: false
        description: >-
          Kayıt ve görseller korunur; kart, modal, filtre ve sayaca dahil edilmez. Yeniden yayımlamak için
          kapatın.
      - name: category
        label: Kategori
        type: reference
        required: true
        options:
          collection: categories
          value: '{fields.key}'
          label: '{fields.tr} / {fields.en}'
          search: key,tr,en
      - name: tr
        label: Türkçe
        type: object
        required: true
        fields:
          - name: title
            label: Başlık
            type: string
            required: true
          - name: summary
            label: Kart özeti
            type: text
            required: true
            description: Metin ve mevcut <strong>/<em>/<br> biçimlendirmesi korunur; Markdown kullanılmaz.
          - name: intro
            label: Detay giriş açıklaması
            type: text
            description: Metin ve mevcut <strong>/<em>/<br> biçimlendirmesi korunur; Markdown kullanılmaz.
          - name: problem
            label: Sorun
            type: text
            description: Metin ve mevcut <strong>/<em>/<br> biçimlendirmesi korunur; Markdown kullanılmaz.
          - name: solution
            label: Çözüm
            type: text
            description: Metin ve mevcut <strong>/<em>/<br> biçimlendirmesi korunur; Markdown kullanılmaz.
          - name: impact
            label: Etki
            type: text
            description: Metin ve mevcut <strong>/<em>/<br> biçimlendirmesi korunur; Markdown kullanılmaz.
          - name: technologies
            label: Kart teknoloji etiketleri
            type: string
            list: true
          - name: detailTechnologies
            label: Detay teknoloji etiketleri
            type: string
            list: true
            description: Bazı mevcut projelerde kart listesinden farklıdır; iki liste ayrı korunur.
          - name: galleryTitle
            label: Galeri başlığı
            type: string
          - name: galleryIntro
            label: Galeri açıklaması
            type: string
          - name: legacyModalTail
            type: string
            hidden: true
            default: ''
      - name: en
        label: English
        type: object
        required: true
        fields:
          - name: title
            label: Başlık
            type: string
            required: true
          - name: summary
            label: Kart özeti
            type: text
            required: true
            description: Metin ve mevcut <strong>/<em>/<br> biçimlendirmesi korunur; Markdown kullanılmaz.
          - name: intro
            label: Detay giriş açıklaması
            type: text
            description: Metin ve mevcut <strong>/<em>/<br> biçimlendirmesi korunur; Markdown kullanılmaz.
          - name: problem
            label: Sorun
            type: text
            description: Metin ve mevcut <strong>/<em>/<br> biçimlendirmesi korunur; Markdown kullanılmaz.
          - name: solution
            label: Çözüm
            type: text
            description: Metin ve mevcut <strong>/<em>/<br> biçimlendirmesi korunur; Markdown kullanılmaz.
          - name: impact
            label: Etki
            type: text
            description: Metin ve mevcut <strong>/<em>/<br> biçimlendirmesi korunur; Markdown kullanılmaz.
          - name: technologies
            label: Kart teknoloji etiketleri
            type: string
            list: true
          - name: detailTechnologies
            label: Detay teknoloji etiketleri
            type: string
            list: true
            description: Bazı mevcut projelerde kart listesinden farklıdır; iki liste ayrı korunur.
          - name: galleryTitle
            label: Galeri başlığı
            type: string
          - name: galleryIntro
            label: Galeri açıklaması
            type: string
          - name: legacyModalTail
            type: string
            hidden: true
            default: ''
      - name: gallery
        label: Galeri (sürükleyerek sıralayın)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{altTR}'
        fields:
          - name: file
            label: Görsel
            type: image
            required: true
            options:
              media: portfolio
              extensions:
                - png
                - jpg
                - jpeg
          - name: altTR
            label: Türkçe alternatif metin
            type: string
            required: true
          - name: altEN
            label: English alternative text
            type: string
            required: true
      - name: links
        label: Proje bağlantıları (isteğe bağlı)
        type: object
        list: true
        fields:
          - name: url
            label: Adres
            type: string
            required: true
          - name: labelTR
            label: Türkçe etiket
            type: string
            required: true
          - name: labelEN
            label: English label
            type: string
            required: true
        description: >-
          İsteğe bağlı. HTTPS adresi veya / ile başlayan site içi yol. Eklenen her bağlantıda iki dilde etiket
          gerekir.
  - name: categories
    label: Portfolyo kategorileri
    type: collection
    path: src/content/categories
    format: json
    subfolders: false
    filename:
      template: '{fields.key}.json'
      field: false
    operations:
      create: true
      rename: false
      delete: true
    view:
      primary: tr
      fields:
        - key
        - tr
        - en
        - order
      sort:
        - order
        - key
      default:
        sort: order
        order: asc
    fields:
      - name: key
        label: Kalıcı kategori anahtarı
        type: string
        required: true
        pattern: ^[a-z][a-z0-9-]*$
        description: >-
          Küçük Latin harf, rakam ve tire. all kullanılamaz. Kullanılan anahtarı değiştirmeyin; silmeden önce
          tüm proje referanslarını (arşivdekiler dahil) başka kategoriye taşıyın.
      - name: tr
        label: Türkçe ad
        type: string
        required: true
      - name: en
        label: English name
        type: string
        required: true
      - name: order
        label: Filtre sırası
        type: number
        options:
          min: 1
        description: Boşlar sonda; eşit sıralarda kategori anahtarı kullanılır.
      - name: color
        label: Renk (isteğe bağlı)
        type: string
        pattern: ^#[a-fA-F0-9]{6}$
        description: 'Örnek: #48C9B0. Boş bırakılırsa mevcut turkuaz renk kullanılır.'
