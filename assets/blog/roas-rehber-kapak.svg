<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">ROAS ve gerçek kârlılık</title><desc id="desc">Üç farklı ROAS değeri aynı maliyet yapısında değerlendirilmelidir.</desc><rect width="1200" height="675" fill="#07102A"/><path d="M48 72H1152" stroke="#C9A84C" stroke-opacity=".4"/><text x="48" y="50" fill="#C9A84C" font-family="Arial,DejaVu Sans,sans-serif" font-size="16">MUSTAFA ANIL AŞLAKCI  /  BLOG</text><text x="48" y="151" fill="#F7F2E8" font-family="Arial,DejaVu Sans,sans-serif" font-size="52">ROAS NEDİR?</text><text x="48" y="205" fill="#C1C5D1" font-family="Arial,DejaVu Sans,sans-serif" font-size="32">3, 5 veya 10: Hangisi gerçekten kârlı?</text><rect x="48" y="280" width="340" height="145" rx="12" fill="#0D1B3E" stroke="#C9A84C" stroke-opacity=".55"/><text x="70" y="328" fill="#E2C97E" font-family="Arial,DejaVu Sans,sans-serif" font-size="36">3× ROAS</text><text x="70" y="365" fill="#C1C5D1" font-family="Arial,DejaVu Sans,sans-serif" font-size="18">Tek başına karar değildir.</text><rect x="430" y="280" width="340" height="145" rx="12" fill="#0D1B3E" stroke="#C9A84C" stroke-opacity=".55"/><text x="452" y="328" fill="#E2C97E" font-family="Arial,DejaVu Sans,sans-serif" font-size="36">5× ROAS</text><text x="452" y="365" fill="#C1C5D1" font-family="Arial,DejaVu Sans,sans-serif" font-size="18">Önce katkı marjını bulun.</text><rect x="812" y="280" width="340" height="145" rx="12" fill="#0D1B3E" stroke="#C9A84C" stroke-opacity=".55"/><text x="834" y="328" fill="#E2C97E" font-family="Arial,DejaVu Sans,sans-serif" font-size="36">10× ROAS</text><text x="834" y="365" fill="#C1C5D1" font-family="Arial,DejaVu Sans,sans-serif" font-size="18">Ölçümü de doğrulayın.</text><text x="48" y="510" fill="#E2C97E" font-family="Arial,DejaVu Sans,sans-serif" font-size="44">Gelir ≠ Kâr</text><text x="48" y="560" fill="#F7F2E8" font-family="Arial,DejaVu Sans,sans-serif" font-size="24">Reklam sonucu + maliyet tablosu + gerçekleşmiş sipariş</text><text x="48" y="647" fill="#AEB6C8" font-family="Arial,DejaVu Sans,sans-serif" font-size="16">anilaslakci.com.tr · Özgün editoryal grafik</text></svg>