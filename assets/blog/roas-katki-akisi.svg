eklam gideri</text><rect x="960" y="190" width="200" height="120" rx="12" fill="#0D1B3E" stroke="#C9A84C" stroke-opacity=".55"/><text x="982" y="238" fill="#E2C97E" font-family="Arial,DejaVu Sans,sans-serif" font-size="24">50 TL</text><text x="982" y="275" fill="#C1C5D1" font-family="Arial,DejaVu Sans,sans-serif" font-size="18">Kalan katkı</text><text x="48" y="385" fill="#C1C5D1" font-family="Arial,DejaVu Sans,sans-serif" font-size="22">Varsayımsal, aynı hesap tabanı. Sabit giderler henüz çıkarılmadı.</text><text x="48" y="422" fill="#AEB6C8" font-family="Arial,DejaVu Sans,sans-serif" font-size="16">anilaslakci.com.tr · Özgün editoryal grafik</text></svg>