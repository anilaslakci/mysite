# Main-only production workflow; actual build time gates editorial publication.
# UTC+03: daily 09:00 retained; daily 10:00 target; Monday 10:17/10:37 retries.
# GitHub cron is best-effort: no exact-minute publication guarantee.
name: Production Pages publishing
'on':
  push:
    branches:
      - main
  schedule:
    - cron: 0 6 * * *
    - cron: 0 7 * * *
    - cron: 17,37 7 * * 1
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: approved-production-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'anilaslakci/mysite' && vars.ENABLE_SITE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:blog
      - run: npm run test:i18n
      - run: npm run test:workflow
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
          name: github-pages
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.repository == 'anilaslakci/mysite' && vars.ENABLE_SITE_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: github-pages
env:
  ENABLE_SITE_DEPLOY: ${{ vars.ENABLE_SITE_DEPLOY }}
